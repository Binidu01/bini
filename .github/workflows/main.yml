name: Update Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "docs/**"
      - "showcase/**"
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    name: Generate Sitemap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const ROOT = path.resolve(".");
          const OUTPUT = path.resolve("sitemap.xml");
          const BASE_URL = "https://bini.js.org";

          // Skip non-page directories
          const SKIP_DIRS = new Set([
            ".git",
            ".github",
            "node_modules",
            "assets",
            "css",
            "js",
            "_next",
            "static",
          ]);

          function walk(dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (SKIP_DIRS.has(entry.name) || entry.name.startsWith(".")) {
                  continue;
                }
                files.push(...walk(fullPath));
              } else if (entry.isFile() && entry.name === "index.html") {
                files.push(fullPath);
              }
            }
            return files;
          }

          function fileToRoute(file) {
            // ./index.html           → /
            // ./docs/index.html      → /docs
            // ./showcase/foo/index.html → /showcase/foo
            const relative = path.relative(ROOT, path.dirname(file));
            if (relative === "" || relative === ".") return "/";
            return (
              "/" +
              relative
                .replace(/\\/g, "/")
                .replace(/\/+/g, "/")
                .replace(/\/$/, "")
            );
          }

          function getLastmod(filePath) {
            try {
              const date = execSync(
                `git log -1 --format=%cI -- "${filePath}"`,
                { encoding: "utf8" }
              ).trim();
              return date || null;
            } catch {
              return null;
            }
          }

          function escapeXml(value) {
            return value
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          console.log(`Scanning: ${ROOT}`);

          const indexFiles = walk(ROOT);
          const byRoute = new Map();

          for (const file of indexFiles) {
            const route = fileToRoute(file);
            const lastmod = getLastmod(file);

            const existing = byRoute.get(route);
            if (
              !existing ||
              (lastmod && (!existing.lastmod || lastmod > existing.lastmod))
            ) {
              byRoute.set(route, { route, lastmod, file });
            }
          }

          const routes = [...byRoute.values()].sort((a, b) => {
            if (a.route === "/") return -1;
            if (b.route === "/") return 1;
            return a.route.localeCompare(b.route);
          });

          const sitemap = [
            `<?xml version="1.0" encoding="UTF-8"?>`,
            `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">`,
            ...routes.map(({ route, lastmod }) => {
              const url = `${BASE_URL}${route === "/" ? "" : route}`;
              const lines = [
                `  <url>`,
                `    <loc>${escapeXml(url)}</loc>`,
              ];
              if (lastmod) {
                lines.push(`    <lastmod>${escapeXml(lastmod)}</lastmod>`);
              }
              lines.push(`  </url>`);
              return lines.join("\n");
            }),
            `</urlset>`,
            ``,
          ].join("\n");

          fs.writeFileSync(OUTPUT, sitemap, "utf8");

          console.log(`Generated ${OUTPUT}`);
          console.log(`Found ${routes.length} routes:`);
          for (const { route, lastmod } of routes) {
            console.log(`  ${route}${lastmod ? ` (${lastmod})` : ""}`);
          }
          EOF

      - name: Commit sitemap
        shell: bash
        run: |
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "Sitemap is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update sitemap"
          git push
