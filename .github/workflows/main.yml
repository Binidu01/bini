name: Update Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    name: Generate Sitemap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate lastmod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const ROOT = path.resolve("src/app");
          const OUTPUT = path.resolve("sitemap.xml");
          const BASE_URL = "https://bini.js.org";
          const EXTENSIONS = new Set([".tsx", ".jsx"]);

          const SPECIAL_FILES = new Set([
            "layout",
            "loading",
            "error",
            "not-found",
            "notfound",
            "template",
            "default",
            "route",
          ]);

          function isPrivateOrParallel(name) {
            return name.startsWith("_") || name.startsWith("@");
          }

          function isRouteGroup(name) {
            return name.startsWith("(") && name.endsWith(")");
          }

          function isDynamicSegment(name) {
            return (
              (name.startsWith("[") && name.endsWith("]")) ||
              name.startsWith("[[") ||
              name.includes("[...")
            );
          }

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              if (isPrivateOrParallel(entry.name)) continue;

              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (isDynamicSegment(entry.name)) continue;
                files.push(...walk(fullPath));
              } else if (entry.isFile()) {
                files.push(fullPath);
              }
            }
            return files;
          }

          function fileToRoute(file) {
            const relative = path.relative(ROOT, file);
            const parsed = path.parse(relative);

            if (!EXTENSIONS.has(parsed.ext)) return null;

            const filename = parsed.name;
            if (SPECIAL_FILES.has(filename)) return null;

            const dirParts = path
              .dirname(relative)
              .split(path.sep)
              .filter((p) => p !== "." && !isRouteGroup(p));

            if (filename !== "page") return null;

            const route =
              dirParts.length === 0 ? "/" : "/" + dirParts.join("/");

            return (
              route
                .replace(/\\/g, "/")
                .replace(/\/+/g, "/")
                .replace(/\/$/, "") || "/"
            );
          }

          function getLastmod(filePath) {
            try {
              const date = execSync(
                `git log -1 --format=%cI -- "${filePath}"`,
                { encoding: "utf8" }
              ).trim();
              return date || null;
            } catch {
              return null;
            }
          }

          function escapeXml(value) {
            return value
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          if (!fs.existsSync(ROOT)) {
            throw new Error(`Route directory not found: ${ROOT}`);
          }

          const pageFiles = walk(ROOT);
          const routeEntries = [];

          for (const file of pageFiles) {
            const route = fileToRoute(file);
            if (!route) continue;

            const lastmod = getLastmod(file);
            routeEntries.push({ route, lastmod, file });
          }

          // Dedupe by route (keep the most recent lastmod if duplicates)
          const byRoute = new Map();
          for (const entry of routeEntries) {
            const existing = byRoute.get(entry.route);
            if (
              !existing ||
              (entry.lastmod &&
                (!existing.lastmod || entry.lastmod > existing.lastmod))
            ) {
              byRoute.set(entry.route, entry);
            }
          }

          const routes = [...byRoute.values()].sort((a, b) => {
            if (a.route === "/") return -1;
            if (b.route === "/") return 1;
            return a.route.localeCompare(b.route);
          });

          const cleanSitemap = [
            `<?xml version="1.0" encoding="UTF-8"?>`,
            `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">`,
            ...routes.map(({ route, lastmod }) => {
              const url = `${BASE_URL}${route === "/" ? "" : route}`;
              const lines = [
                `  <url>`,
                `    <loc>${escapeXml(url)}</loc>`,
              ];
              if (lastmod) {
                lines.push(`    <lastmod>${escapeXml(lastmod)}</lastmod>`);
              }
              lines.push(`  </url>`);
              return lines.join("\n");
            }),
            `</urlset>`,
            ``,
          ].join("\n");

          fs.writeFileSync(OUTPUT, cleanSitemap, "utf8");

          console.log(`Generated ${OUTPUT}`);
          console.log(`Found ${routes.length} routes:`);
          for (const { route, lastmod } of routes) {
            console.log(`  ${route}${lastmod ? ` (${lastmod})` : ""}`);
          }
          EOF

      - name: Commit sitemap
        shell: bash
        run: |
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "Sitemap is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update sitemap"
          git push
