name: Update Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    name: Generate Sitemap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check whether sitemap needs generation
        id: check
        shell: bash
        run: |
          if [ ! -f sitemap.xml ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "sitemap.xml does not exist. Generating it."
            exit 0
          fi

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit. Generating sitemap."
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-status HEAD^ HEAD -- src/app/ || true)"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Generate when routes are added, deleted, or renamed
          if echo "$CHANGED_FILES" | grep -qE '^(A|D|R)'; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "Route added, deleted, or renamed."
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "No route additions, deletions, or renames."
          fi

      - name: Generate sitemap
        if: steps.check.outputs.generate == 'true'
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const ROOT = path.resolve("src/app");
          const OUTPUT = path.resolve("sitemap.xml");
          const BASE_URL = "https://bini.js.org";
          const EXTENSIONS = new Set([".tsx", ".jsx"]);

          // Next.js special files that are not routes
          const SPECIAL_FILES = new Set([
            "layout",
            "loading",
            "error",
            "not-found",
            "notfound",
            "template",
            "default",
            "route", // route handlers
          ]);

          function isPrivateOrParallel(name) {
            // _private folders and @parallel slots
            return name.startsWith("_") || name.startsWith("@");
          }

          function isRouteGroup(name) {
            // (group) — invisible in the URL
            return name.startsWith("(") && name.endsWith(")");
          }

          function isDynamicSegment(name) {
            // [param], [...slug], [[...slug]]
            return (
              (name.startsWith("[") && name.endsWith("]")) ||
              name.startsWith("[[") ||
              name.includes("[...")
            );
          }

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              if (isPrivateOrParallel(entry.name)) continue;

              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                // Skip dynamic segments entirely for a static sitemap
                if (isDynamicSegment(entry.name)) continue;
                files.push(...walk(fullPath));
              } else if (entry.isFile()) {
                files.push(fullPath);
              }
            }
            return files;
          }

          function fileToRoute(file) {
            const relative = path.relative(ROOT, file);
            const parsed = path.parse(relative);

            if (!EXTENSIONS.has(parsed.ext)) return null;

            const filename = parsed.name;
            if (SPECIAL_FILES.has(filename)) return null;

            // Build path segments, stripping route groups
            const dirParts = path
              .dirname(relative)
              .split(path.sep)
              .filter((p) => p !== "." && !isRouteGroup(p));

            let route;
            if (filename === "page") {
              route = dirParts.length === 0 ? "/" : "/" + dirParts.join("/");
            } else {
              // Non-page files are not routes in the App Router
              return null;
            }

            return (
              route
                .replace(/\\/g, "/")
                .replace(/\/+/g, "/")
                .replace(/\/$/, "") || "/"
            );
          }

          function escapeXml(value) {
            return value
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          if (!fs.existsSync(ROOT)) {
            throw new Error(`Route directory not found: ${ROOT}`);
          }

          const routes = [
            ...new Set(
              walk(ROOT)
                .map(fileToRoute)
                .filter(Boolean)
            ),
          ].sort((a, b) => {
            if (a === "/") return -1;
            if (b === "/") return 1;
            return a.localeCompare(b);
          });

          const urls = routes
            .map((route) => {
              const url = `${BASE_URL}${route === "/" ? "" : route}`;
              return `  <url>\n    <loc>${escapeXml(url)}</loc>\n  </url>`;
            })
            .join("\n");

          const sitemap = `<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          ${urls}
          </urlset>
          `
            .split("\n")
            .map((line) => line.replace(/^ {10}/, "")) // only if still indented from heredoc
            .join("\n")
            .trim() + "\n";

          // Cleaner approach: build without leading spaces in the template
          const cleanSitemap = [
            `<?xml version="1.0" encoding="UTF-8"?>`,
            `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">`,
            ...routes.map((route) => {
              const url = `${BASE_URL}${route === "/" ? "" : route}`;
              return `  <url>\n    <loc>${escapeXml(url)}</loc>\n  </url>`;
            }),
            `</urlset>`,
            ``,
          ].join("\n");

          fs.writeFileSync(OUTPUT, cleanSitemap, "utf8");

          console.log(`Generated ${OUTPUT}`);
          console.log(`Found ${routes.length} routes:`);
          for (const route of routes) {
            console.log(`  ${route}`);
          }
          EOF

      - name: Commit sitemap
        if: steps.check.outputs.generate == 'true'
        shell: bash
        run: |
          # Stage and check if anything actually changed
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "Sitemap is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update sitemap"
          git push
